<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UniLife OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Nunito:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="assets/icons/icon-192.png" alt="" width="28" height="28"><span>UniLife OS</span></div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim" data-act="menu"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu" data-act="menu" aria-label="Menu"><i data-lucide="menu"></i></button>
      <input id="search" class="search" type="search">
      <button class="icon-btn" data-act="quicktheme" aria-label="Theme"><i data-lucide="sun-moon"></i></button>
    </header>
    <main id="view"></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<div id="modal" class="modal" hidden></div>
<div id="toasts"></div>
<script src="https://unpkg.com/lucide@0.383.0"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/importer.js"></script>
<script src="js/push-config.js"></script>
<script src="js/notifications.js"></script>
<script src="js/app.js"></script>
<script src="ui.js"></script>
</body>
</html>
